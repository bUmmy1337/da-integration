plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

configurations {
    addtojar {
        // Minecraft already ships Gson
        exclude group: 'com.google.code.gson'
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    implementation "net.fabricmc:fabric-loader:${project.loader_version}"

    implementation project(path: ':DonationAlerts', configuration: 'default')
    addtojar project(path: ':DonationAlerts', configuration: 'default')

    // The ImGui menu and its native libraries for every desktop platform
    implementation project(path: ':DaUi', configuration: 'default')
    addtojar project(path: ':DaUi', configuration: 'default')
    ['windows', 'linux', 'macos'].each { os ->
        addtojar "io.github.spair:imgui-java-natives-${os}:${project.imgui_version}"
    }

    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version

    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'META-INF/*.SF', 'META-INF/*.DSA', 'META-INF/*.RSA', 'module-info.class'
    from {
        configurations.addtojar.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java
        }
    }
    repositories {
    }
}
