name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Modifications
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build the mod and run tests
        run: gradle :DonationAlerts:test :DaUi:test :fabric_1.20:build

      - uses: actions/upload-artifact@v4
        with:
          name: daintegrate-mod
          path: Modifications/fabric_1.20/build/libs/*.jar
          if-no-files-found: error


      # Temporary: find where 26.3 keeps titles and the action bar message
      - name: Inspect Minecraft API
        if: failure()
        run: |
          JAR=$(find ~/.gradle/caches -name "minecraft-*merged*named*.jar" -o -name "minecraft-client*named*.jar" | grep -v sources | head -1)
          [ -z "$JAR" ] && JAR=$(find ~/.gradle/caches/fabric-loom -name "*.jar" | grep -i minecraft | grep -v sources | head -1)
          echo "jar: $JAR"
          mkdir -p /tmp/mc && cd /tmp/mc && unzip -q -o "$JAR" 'net/*' 'com/mojang/*'
          echo "=== Gui"; javap -p net/minecraft/client/gui/Gui.class | grep -iE "title|overlay|subtitle|times|hud|public .*;" | head -60
          echo "=== classes with setTitle/setOverlayMessage/setTimes"
          for f in $(grep -rlE "setOverlayMessage|setSubtitle|setTimes|ClientboundSetTitleTextPacket" --include=*.class net/minecraft/client | head -12); do
            echo "=== $f"; javap -p "$f" | grep -iE "title|overlay|subtitle|times|actionbar"
          done
          echo "=== ClientPacketListener title handlers"
          javap -p -c net/minecraft/client/multiplayer/ClientPacketListener.class | grep -A25 -E "void (setTitleText|setSubtitleText|setTitlesAnimation|setActionBarText)\(" | grep -E "invoke|void " | head -40
