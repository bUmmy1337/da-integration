name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Modifications
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build the mod and run tests
        run: gradle :DonationAlerts:test :DaUi:test :fabric_1.20:build --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: daintegrate-mod
          path: Modifications/fabric_1.20/build/libs/*.jar
          if-no-files-found: error
