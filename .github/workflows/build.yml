name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Modifications
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build the mod and run tests
        run: gradle :DonationAlerts:test :DaUi:test :fabric_1.20:build

      - uses: actions/upload-artifact@v4
        with:
          name: daintegrate-mod
          path: Modifications/fabric_1.20/build/libs/*.jar
          if-no-files-found: error

      # Temporary: list the Minecraft API the mod uses, to fix the port against the real 26.3 names
      - name: Inspect Minecraft API
        if: failure()
        run: |
          JAR=$(find ~/.gradle/caches -name "minecraft-*merged*named*.jar" -o -name "minecraft-client*named*.jar" | grep -v sources | head -1)
          [ -z "$JAR" ] && JAR=$(find ~/.gradle/caches/fabric-loom -name "*.jar" | grep -i minecraft | grep -v sources | head -1)
          echo "jar: $JAR"
          unzip -Z1 "$JAR" | grep -E "(RenderPipeline|GuiRenderState|GuiElementRenderState|/Util\.class|Util\.class$|render/state/)" | grep -v '\$' | head -40
          for c in net.minecraft.client.Minecraft 'com.mojang.blaze3d.platform.InputConstants$Type' net.minecraft.client.gui.GuiGraphicsExtractor; do
            echo "=== $c"; javap -cp "$JAR" "$c" | grep -iE "screen|enum|KEYSYM|static final|GuiRenderState|Type " | head -40
          done
